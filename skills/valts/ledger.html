<meta name="claude:viewport-fit-sides" content="cover">
<title>Claim ledger</title>
<style>
/* Layout: summary counts on top, filters, then the claim table; open items list below. */
:root {
  --bg: #fafaf7; --fg: #1d1d1b; --muted: #66665f; --line: #dcdcd5; --surface: #ffffff;
  --accent: #2f5d7c; --ok: #2d6a3e; --warn: #8a5a00; --bad: #9b2c2c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161715; --fg: #ecebe6; --muted: #9a9a92; --line: #3a3b37; --surface: #1f201d;
    --accent: #8fbcd6; --ok: #8fd19e; --warn: #e6b65c; --bad: #f08a8a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161715; --fg: #ecebe6; --muted: #9a9a92; --line: #3a3b37; --surface: #1f201d;
  --accent: #8fbcd6; --ok: #8fd19e; --warn: #e6b65c; --bad: #f08a8a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { padding-block: 20px 40px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 16px; margin: 28px 0 8px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.count { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); min-width: 0; }
.count b { font-variant-numeric: tabular-nums; font-size: 18px; display: block; }
.count span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
button, select, input { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button.on { border-color: var(--accent); color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.status { font-size: 12px; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; white-space: nowrap; }
.s-true { color: var(--ok); } .s-partly_true { color: var(--warn); } .s-false { color: var(--bad); }
.s-opinion, .s-open, .s-unverified { color: var(--muted); }
.empty { padding: 24px; color: var(--muted); text-align: center; }
.add { display: grid; gap: 8px; grid-template-columns: 1fr; margin-top: 12px; }
@media (min-width: 640px) { .add { grid-template-columns: 2fr 1fr 1fr 1fr auto; } }
.add input, .add select { min-width: 0; width: 100%; }
.add button { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.msg { color: var(--muted); font-size: 13px; min-height: 1.4em; }
ul.open { padding-left: 18px; margin: 0; }
ul.open li { margin-bottom: 4px; overflow-wrap: anywhere; }
.src a { color: var(--accent); overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>

<main>
  <h1>Claim ledger</h1>
  <p class="sub">Every claim, its status, and its source. Shared rows: anyone who can write here sees your changes.</p>

  <div class="counts" id="counts"></div>

  <div class="filters" id="filters"></div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Claim</th><th>Status</th><th>Source</th><th>Date</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>

  <h2>Open items</h2>
  <p class="sub" style="margin-top:0">Unverified and open claims. Copy into a reply or ask the author.</p>
  <ul class="open" id="open"></ul>
  <p class="empty" id="openEmpty" hidden style="text-align:left;padding:0">Nothing open.</p>

  <h2>Add a claim</h2>
  <form class="add" id="addForm">
    <input name="claim" placeholder="Claim, as the text states it" required aria-label="Claim">
    <select name="status" aria-label="Status">
      <option value="open">open</option>
      <option value="true">true</option>
      <option value="partly_true">partly true</option>
      <option value="false">false</option>
      <option value="unverified">unverified</option>
      <option value="opinion">opinion</option>
    </select>
    <input name="source" placeholder="Source URL or reference" aria-label="Source">
    <input name="date" type="date" aria-label="Date of information">
    <button type="submit">Add</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>

<script>
const STATUSES = ["open", "unverified", "opinion", "partly_true", "true", "false"];
const LABEL = { open: "open", unverified: "unverified", opinion: "opinion", partly_true: "partly true", true: "true", false: "false" };
let rows = [];
let filter = "all";
let db = null;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") n.textContent = v; else if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const c of kids) n.append(c);
  return n;
};
const say = (text) => { $("msg").textContent = text; };

function renderCounts() {
  const counts = Object.fromEntries(STATUSES.map((s) => [s, 0]));
  rows.forEach((r) => { if (r.status in counts) counts[r.status]++; });
  $("counts").replaceChildren(
    el("div", { class: "count" }, [el("b", { text: String(rows.length) }), el("span", { text: "total" })]),
    ...STATUSES.map((s) => el("div", { class: "count" }, [el("b", { text: String(counts[s]) }), el("span", { text: LABEL[s] })]))
  );
}

function renderFilters() {
  const make = (key, label) => el("button", { type: "button", class: filter === key ? "on" : "", "data-f": key, text: label });
  $("filters").replaceChildren(make("all", "all"), ...STATUSES.map((s) => make(s, LABEL[s])));
}

function renderRows() {
  const shown = filter === "all" ? rows : rows.filter((r) => r.status === filter);
  $("empty").hidden = shown.length > 0;
  $("empty").textContent = rows.length ? "No claims with this status." : "No claims yet. Add the first one below.";
  $("rows").replaceChildren(...shown.map((r) => {
    const sel = el("select", { "aria-label": "Status for " + (r.claim || r.id) }, STATUSES.map((s) => {
      const o = el("option", { value: s, text: LABEL[s] }); if (s === r.status) o.selected = true; return o;
    }));
    sel.addEventListener("change", () => setStatus(r.id, sel.value));
    const del = el("button", { type: "button", text: "Delete" });
    del.addEventListener("click", () => {
      if (del.dataset.armed) { removeRow(r.id); return; }
      del.dataset.armed = "1"; del.textContent = "Confirm delete";
    });
    const src = r.source ? el("td", { class: "src" }, [el("a", { href: r.source, target: "_blank", rel: "noopener", text: r.source })]) : el("td", { text: "" });
    return el("tr", {}, [
      el("td", { text: r.claim || "" }),
      el("td", {}, [sel]),
      src,
      el("td", { class: "num", text: r.date || "" }),
      el("td", {}, [del]),
    ]);
  }));
}

function renderOpen() {
  const open = rows.filter((r) => r.status === "open" || r.status === "unverified");
  $("open").replaceChildren(...open.map((r) => el("li", { text: r.claim + (r.status === "unverified" ? " (unverified)" : " (open)") })));
  $("openEmpty").hidden = open.length > 0;
}

function render() { renderCounts(); renderFilters(); renderRows(); renderOpen(); }

async function setStatus(id, status) {
  if (!db) return say("Read-only: you cannot change claims here.");
  try { await db.collection("claims").doc(id).update({ status }); say("Saved."); }
  catch (e) { say(e.code === "invalid_argument" ? "Not allowed: your access is read-only." : "Could not save: " + (e.message || e.code)); }
}

async function removeRow(id) {
  if (!db) return;
  try { await db.collection("claims").doc(id).delete(); say("Deleted."); }
  catch (e) { say("Could not delete: " + (e.message || e.code)); }
}

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f; render();
});

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const claim = String(f.get("claim") || "").trim();
  if (!claim) return;
  if (!db) return say("Read-only: you cannot add claims here.");
  try {
    await db.collection("claims").add({
      claim, status: String(f.get("status")), source: String(f.get("source") || "").trim(),
      date: String(f.get("date") || ""), created: new Date().toISOString(),
    });
    e.target.reset(); say("Added.");
  } catch (err) { say(err.code === "quota_exceeded" ? "The ledger is full." : "Could not add: " + (err.message || err.code)); }
});

(async () => {
  render();
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { $("addForm").hidden = true; say("Read-only view. Open this page in Claude to edit."); return; }
  db.collection("claims").orderBy("created", "desc").onSnapshot(
    (snap) => { rows = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })); render(); },
    (err) => say("Live updates stopped: " + (err.message || err.code))
  );
})();
</script>
